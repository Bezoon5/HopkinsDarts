*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

function enc(str){var u=unescape(encodeURIComponent(str)),a=new Uint8Array(u.length);for(var i=0;i<u.length;i++)a[i]=u.charCodeAt(i);return a}
function dec(b){var x='';for(var i=0;i<b.length;i+=4096)x+=String.fromCharCode.apply(null,Array.prototype.slice.call(b.subarray(i,i+4096)));try{return decodeURIComponent(escape(x))}catch(e){return x}}
function cat(list){var n=0,i;for(i=0;i<list.length;i++)n+=list[i].length;var u=new Uint8Array(n),off=0;for(i=0;i<list.length;i++){u.set(list[i],off);off+=list[i].length}return u}
function mstr(str){var b=enc(str),u=new Uint8Array(b.length+2);u[0]=b.length>>8;u[1]=b.length&255;u.set(b,2);return u}

function Relay(url,topics,onMsg,onState){this.url=url;this.topics=topics;this.onMsg=onMsg;this.onState=onState;this.ok=false;this.wait=0;this.rx=0;this.st='connecting';this.pid=1;this.open()}
Relay.prototype.open=function(){var me=this,ws;if(me.ws)return;
  try{ws=new WebSocket(me.url,'mqtt')}catch(e){me.st='blocked';me.onState();me.retry();return}
  me.ws=ws;ws.binaryType='arraybuffer';me.buf=new Uint8Array(0);me.ok=false;me.st='connecting';
  var to=setTimeout(function(){if(me.ws===ws&&!me.ok){me.st='no answer';me.drop()}},10000);
  ws.onopen=function(){var id='tv'+Math.random().toString(36).slice(2,12);ws.send(packet(0x10,cat([mstr('MQTT'),new Uint8Array([4,2,0,45]),mstr(id)])))};
  ws.onmessage=function(e){if(me.ws===ws)me.data(new Uint8Array(e.data))};
  ws.onerror=ws.onclose=function(){clearTimeout(to);if(me.ws===ws){if(me.st==='connecting')me.st='failed';me.drop()}}};
Relay.prototype.drop=function(){var ws=this.ws;this.ws=null;this.ok=false;clearInterval(this.ping);try{ws&&ws.close()}catch(e){}if(this.st==='online')this.st='reconnecting';this.onState();this.retry()};
Relay.prototype.retry=function(){var me=this;clearTimeout(me.rt);me.wait=Math.min(me.wait?me.wait*2:1000,30000);me.rt=setTimeout(function(){me.open()},me.wait)};
Relay.prototype.kick=function(){if(!this.ws){clearTimeout(this.rt);this.wait=0;this.open()}};
Relay.prototype.send=function(u){try{this.ws.send(u)}catch(e){}};
Relay.prototype.data=function(chunk){this.rx=Date.now();this.buf=cat([this.buf,chunk]);
  for(;;){var b=this.buf;if(b.length<2)return;var len=0,mul=1,i=1,d;do{if(i>=b.length)return;d=b[i++];len+=(d&127)*mul;mul*=128}while((d&128)&&i<5);
    if(b.length<i+len)return;this.pkt(b[0]>>4,b[0]&15,b.subarray(i,i+len));this.buf=b.subarray(i+len)}};
Relay.prototype.pkt=function(type,flags,b){var me=this;
  if(type===2){if(b[1]!==0){me.st='refused';me.drop();return}
    me.ok=true;me.wait=0;me.st='online';
    for(var k=0;k<me.topics.length;k++){var id=(me.pid=(me.pid%65535)+1);me.send(packet(0x82,cat([new Uint8Array([id>>8,id&255]),mstr(me.topics[k]),new Uint8Array([0])])))}

// ---------- TV ----------
var S={t:0,seen:{},nseen:0,calls:[],callT:0,relays:[],mouseT:0,animUntil:0,statsT:0,statsT2:0,lastLeg:-1,lastN:0};
var q=/[?&](?:tv|code)=(\d{6})/.exec(location.search);
var code=q?q[1]:lsGet('tvmycode','');if(!/^\d{6}$/.test(code))code=String(Math.floor(100000+Math.random()*900000));
if(!q)lsSet('tvmycode',code);
$('tvCodeBig').textContent=code.slice(0,3)+' '+code.slice(3);
var tv=$('tv');tv.className='idle';
function state(){var parts=[],up=false;for(var i=0;i<S.relays.length;i++){var r=S.relays[i];if(r.ok)up=true;parts.push(short(r.url)+(r.ok?' ✓':' – '+r.st))}
  var el=$('tvNet');el.textContent='TV '+code+' · '+(window.WebSocket?parts.join(' · '):'this browser has no WebSocket');
  el.className=(!up&&Date.now()-S.boot>12000)?'bad':''}
S.boot=Date.now();
function got(d){if(!d||!d.id||S.seen[d.id])return;S.seen[d.id]=1;if(++S.nseen>300){S.seen={};S.nseen=0}
  if(d.k==='call'){if(Date.now()-d.t<8000)call(d.text);return}
  if(d.k==='ev'){if(Date.now()-d.t<10000)fx(d);return}
  if(d.k!=='snap'||d.t<S.t)return;S.t=d.t;if(d.live&&Date.now()-d.t>6*36e5)d={k:'snap',live:false};
  tv.className=d.live?'':'idle';if(!d.live){$('tvWin').className='hidden';hideStats();return}
  $('tvTitle').innerHTML=d.title;
  if(d.x){bcast(d.x);return}
  var b=$('tvBoard');b.className=d.bcls;b.innerHTML=d.board;
  var n=b.querySelectorAll('.pn,.kcard').length,isK=/kboard/.test(d.bcls);
  var cols=isK?(n<=2?Math.max(1,n):n<=4?2:n<=6?3:4):(n<=4?Math.max(1,n):Math.ceil(n/2));
  $('tvStage').className=(/crboard/.test(d.bcls)||(isK&&n>4))?'wide':'';hideStats();
  var st=b.querySelectorAll('.pn.stack');for(var i=0;i<st.length;i++)st[i].className=st[i].className.replace(/\bstack\b/,'');
  b.style.setProperty('--cols',cols);if(!isK&&cols>=4)b.className+=' c4';
  var pms=b.querySelectorAll('.pn .pmain');for(i=0;i<pms.length;i++){var pm=pms[i],nm=pm.querySelector('.pinfo .pname'),la=pm.querySelector('.pinfo .plast');if(nm)pm.insertBefore(nm,pm.firstChild);if(la)pm.appendChild(la)}
  var pn=b.querySelectorAll(isK?'.kcard':'.pn');var w=(100/cols)+'%';if(!isK)for(i=0;i<pn.length;i++){pn[i].style.flex='0 0 '+w;pn[i].style.maxWidth=w}
  else{b.style.gridTemplateColumns='repeat('+cols+',1fr)'}
  var sp=$('tvStrip');sp.innerHTML=d.strip;var caps=sp.querySelectorAll('.stripcap');
  for(i=0;i<caps.length;i++){var t=caps[i].textContent.replace(/\s*·\s*tap a dart to correct/i,'');if(/^tap /i.test(t))caps[i].parentNode.removeChild(caps[i]);else caps[i].textContent=t}
  var nms=b.querySelectorAll('.pmain>.pname');for(i=0;i<nms.length;i++){var nn=nms[i];nn.style.fontSize='';var f=parseFloat(window.getComputedStyle(nn).fontSize)||40;while(nn.scrollWidth>nn.clientWidth+1&&f>18){f-=2;nn.style.fontSize=f+'px'}}
  var prs=b.querySelectorAll('.pmain>.prem');for(i=0;i<prs.length;i++){var pr=prs[i];pr.style.fontSize='';var g=parseFloat(window.getComputedStyle(pr).fontSize)||100;while(pr.offsetWidth>pr.parentNode.clientWidth-20&&g>40){g-=6;pr.style.fontSize=g+'px'}}
  if(d.win){$('tvWin').className='';$('tvWinSub').textContent=d.sub;$('tvWinName').textContent=d.win}else $('tvWin').className='hidden';
  fit()}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
// ---------- broadcast view (X01) ----------
function bcast(x){var st=$('tvStage');st.className='wide bc';$('tvWin').className='hidden';
  var i,p,n=x.players.length,h='';
  h+='<div class="bc-title"><b>'+x.start+'</b><span>'+(x.sets?'SET '+x.setNo+' · LEG '+x.legNo+' · FIRST TO '+x.setsToWin+' SETS ('+x.legsToWin+' LEGS)':(x.legsToWin>1?'LEG '+x.legNo+' · FIRST TO '+x.legsToWin+' LEGS':'SINGLE LEG'))+(x.dbl?'':' · STRAIGHT OUT')+'</span></div>';
  h+='<table class="sb'+(n>4?' many':n>2?' mid':'')+'"><tr class="hd"><td></td><td></td>'+(x.sets?'<td>SETS</td>':'')+'<td>'+(x.sets?'LEGS':(x.legsToWin>1?'LEGS':''))+'</td><td></td></tr>';
  for(i=0;i<n;i++){p=x.players[i];var on=i===x.cur&&!x.over&&!x.done,pips='';
    if(on){for(var k=0;k<3;k++)pips+='<i class="pip'+(k<x.thrown?' used':'')+'"></i>'}
    h+='<tr class="pl'+(on?' on':'')+'"><td class="ar">'+(on?'▶':'')+'</td><td class="nm"><div class="nmt">'+esc(p.name)+(i===x.starter?'<span class="thr">●</span>':'')+'</div><div class="meta">AVG '+p.avg.toFixed(1)+(p.last!=null?' · LAST '+p.last:'')+(pips?'<span class="pips">'+pips+'</span>':'')+'</div></td>'
      +(x.sets?'<td class="sl">'+p.sets+'</td>':'')+'<td class="sl">'+(x.sets||x.legsToWin>1?p.legs:'')+'</td><td class="sc">'+p.rem+'</td></tr>'}
  h+='</table>';
  var v=x.visit,vh='';
  if(v){var who=x.players[v.p]?x.players[v.p].name:'';
    vh+='<div class="bc-visit"><div class="vl">'+esc(who)+(v.open?' · THIS VISIT':' · LAST VISIT')+'</div><div class="vd">';
    for(i=0;i<3;i++){var dd=v.darts[i];vh+='<span class="vb'+(dd?(dd.m===3?' t':dd.m===2?' d':''):' e')+'">'+(dd?esc(dd.l):'')+'</span>'}
    vh+='<span class="vt'+(v.total==='BUST'?' bust':'')+'">'+v.total+'</span></div></div>'}
  h+=vh;
  if(x.route){h+='<div class="bc-route"><span class="rl">'+esc(x.players[x.cur].name)+' CHECKOUT</span><span class="rc">';for(i=0;i<x.route.length;i++)h+='<b>'+esc(x.route[i])+'</b>';h+='</span></div>'}
  else if(!x.over&&!x.done&&x.players[x.cur]&&x.players[x.cur].rem<=170&&x.dbl){h+='<div class="bc-route none"><span class="rl">'+esc(x.players[x.cur].name)+'</span><span class="rc"><i>NO OUTSHOT</i></span></div>'}
  $('bcRight').innerHTML=h;
  // darts on the board
  var g=$('bcDarts'),svg='';
  if(v){for(i=0;i<v.darts.length;i++){var q=v.darts[i];if(q.x==null)continue;var nw=v.open&&i===v.darts.length-1&&(x.leg!==S.lastLeg||v.darts.length!==S.lastN);
    svg+='<g transform="translate('+q.x+','+(-q.y)+')"><g class="dm'+(nw?' new':'')+'"><circle r="11" class="dmc"/><text y="1" text-anchor="middle" dominant-baseline="central" class="dmt">'+(i+1)+'</text></g></g>'}}
  g.innerHTML=svg;S.lastLeg=x.leg;S.lastN=v?v.darts.length:0;
  var nmt=document.querySelectorAll('#bcRight .nmt');for(i=0;i<nmt.length;i++){var e=nmt[i];e.style.fontSize='';var f=parseFloat(window.getComputedStyle(e).fontSize)||40;while(e.scrollWidth>e.clientWidth+1&&f>16){f-=2;e.style.fontSize=f+'px'}}
  if(v&&v.open&&x.thrown>0)hideStats();
  fit()}
// ---------- animations ----------
function confetti(box,nPieces){var cols=['#B3995D','#fff8ec','#c8342d','#1f8f55','#FEE505','#ffffff'];for(var i=0;i<nPieces;i++){var c=document.createElement('i');c.className='cf';
  c.style.left=(Math.random()*100)+'%';c.style.background=cols[i%cols.length];var du=(2.2+Math.random()*1.8).toFixed(2);c.style.animationDuration=du+'s';c.style.webkitAnimationDuration=du+'s';
  var de=(Math.random()*0.8).toFixed(2);c.style.animationDelay=de+'s';c.style.webkitAnimationDelay=de+'s';c.style.width=(0.6+Math.random()*0.9).toFixed(2)+'vh';box.appendChild(c)}}
function fx(d){var box=$('fx'),el=document.createElement('div'),dur=2500,nm=esc(d.name).toUpperCase();
  if(d.type==='180'){el.className='fx f180';el.innerHTML='<div class="rays"></div><div class="big ol">180</div><div class="sub">'+nm+'</div>';confetti(el,70);dur=3800}
  else if(d.type==='ton'){el.className='fx fton';el.innerHTML='<div class="lt"><b>'+d.value+'</b><span>'+nm+'</span></div>';dur=2600}
  else if(d.type==='bust'){el.className='fx fbust';el.innerHTML='<div class="bb">BUST</div><div class="bn">'+nm+'</div>';dur=1500}
  else if(d.type==='gameshot'){var hi=d.value>=100,lvl=d.level;
    el.className='fx fgs'+(hi?' hi':'')+' l-'+lvl;
    el.innerHTML='<div class="band"></div><div class="gsin"><small>'+(lvl==='match'?'GAME SHOT AND THE MATCH':lvl==='set'?'GAME SHOT AND THE SET':'GAME SHOT')+'</small><b class="ol">'+nm+'</b><div class="co">'+(hi?'<span class="tonco">'+d.value+'</span> CHECKOUT':'CHECKOUT '+d.value)+'<em>'+esc((d.darts||[]).join('  '))+'</em></div></div>';
    if(lvl!=='leg'||hi)confetti(el,lvl==='match'?110:60);dur=lvl==='match'?5200:4300;
    var sd=d;clearTimeout(S.statsT);S.statsT=setTimeout(function(){showStats(sd)},dur-200)}
  else return;
  S.animUntil=Date.now()+dur;box.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},dur+100)}
// ---------- stats between legs ----------
function showStats(d){var P=d.stats||[];if(!P.length)return;var n=P.length,el=$('stats'),i,j;
  var rows=[['avg','THREE-DART AVERAGE',1],['legAvg','AVERAGE THIS LEG',1],['b180','180s',0],['b140','140+',0],['b100','100+',0],['co','CHECKOUT %',0],['hi','HIGHEST CHECKOUT',0]];
  if(d.sets)rows.unshift(['sets','SETS',0]);rows.unshift(['legs','LEGS WON',0]);
  var h='<div class="stc"><div class="sth"><small>'+esc(d.title)+'</small>'+(d.level==='match'?'<b class="ol">'+esc(d.name).toUpperCase()+' WINS</b>':'')+'</div>';
  if(n===2){h+='<div class="stn"><span>'+esc(P[0].name)+'</span><span>'+esc(P[1].name)+'</span></div>';
    for(i=0;i<rows.length;i++){var k=rows[i][0],a=P[0][k],b=P[1][k],fa=a==null?'–':(rows[i][2]?a.toFixed(1):a)+(k==='co'&&a!=null?'%':''),fb=b==null?'–':(rows[i][2]?b.toFixed(1):b)+(k==='co'&&b!=null?'%':'');
      var mx=Math.max(a||0,b||0)||1;
      h+='<div class="str"><span class="v'+((a||0)>(b||0)?' best':'')+'">'+fa+'</span><span class="bar l"><i style="width:'+Math.round((a||0)/mx*100)+'%"></i></span><span class="lab">'+rows[i][1]+'</span><span class="bar r"><i style="width:'+Math.round((b||0)/mx*100)+'%"></i></span><span class="v'+((b||0)>(a||0)?' best':'')+'">'+fb+'</span></div>'}}
  else{h+='<table class="stt"><tr><td></td>';for(j=0;j<n;j++)h+='<th>'+esc(P[j].name)+'</th>';h+='</tr>';
    for(i=0;i<rows.length;i++){var kk=rows[i][0],best=-1,bi=-1;for(j=0;j<n;j++){if((P[j][kk]||0)>best){best=P[j][kk]||0;bi=j}}
      h+='<tr><td class="lab">'+rows[i][1]+'</td>';for(j=0;j<n;j++){var vv=P[j][kk];h+='<td'+(j===bi&&best>0?' class="best"':'')+'>'+(vv==null?'–':(rows[i][2]?vv.toFixed(1):vv)+(kk==='co'?'%':''))+'</td>'}h+='</tr>'}h+='</table>'}
  el.innerHTML=h+'</div>';el.className='';clearTimeout(S.statsT2);S.statsT2=setTimeout(hideStats,d.level==='match'?30000:11000)}
function hideStats(){clearTimeout(S.statsT2);var el=$('stats');if(el&&el.className!=='hidden')el.className='hidden'}
function fit(){var st=$('tvStage');var tf='translate(-50%,-50%)';st.style.transform=st.style.webkitTransform=tf;var w=st.offsetWidth,h=st.offsetHeight;if(!w||!h)return;
  var k=Math.min(window.innerWidth*0.97/w,window.innerHeight*0.96/h);tf+=' scale('+k+')';st.style.transform=st.style.webkitTransform=tf}
function call(text){if(/\bbc\b/.test($('tvStage').className))return;if(Date.now()<S.animUntil+800&&/^(one hundred|game shot|bust)|checkout!?$/i.test(text))return;S.calls.push(text);if(S.calls.length>2)S.calls.splice(0,S.calls.length-2);if(!S.callT)nextCall()}
function nextCall(){var el=$('tvCall'),wait=S.animUntil-Date.now();if(wait>0&&S.calls.length){el.className='hidden';S.callT=setTimeout(nextCall,wait+100);return}var t=S.calls.shift();if(t==null){el.className='hidden';S.callT=0;return}
  el.textContent=t.replace(/[!.]+$/,'');el.className=/one hundred and eighty|game shot|killer!|shanghai|is out|wins/i.test(t)?'big':'';
  S.callT=setTimeout(nextCall,S.calls.length?1300:2600)}
window.addEventListener('resize',fit);
if(window.WebSocket){for(var i=0;i<RELAYS.length;i++)S.relays.push(new Relay(RELAYS[i],[TOPIC+code,TOPIC+code+'/c'],function(t,p){try{got(JSON.parse(p))}catch(e){}},state))}
state();setInterval(state,4000);
window.addEventListener('online',function(){for(var i=0;i<S.relays.length;i++)S.relays[i].kick()});
// same device (laptop / iPad window): local channel and storage too
try{if(window.BroadcastChannel){var bc=new BroadcastChannel(CHAN);bc.onmessage=function(e){got(e.data)};bc.postMessage({k:'hello'})}}catch(e){}
window.addEventListener('storage',function(e){if(e.key===P+'tv'||e.key===P+'tvcall'){try{got(JSON.parse(e.newValue))}catch(x){}}
  else if(e.key===P+'theme'){try{document.documentElement.setAttribute('data-theme',JSON.parse(e.newValue))}catch(x){}}});
$('tvFull').onclick=function(){var el=document.documentElement;try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}};
window.addEventListener('mousemove',function(){tv.className=tv.className.replace(/\s*mouse/,'')+' mouse';clearTimeout(S.mouseT);S.mouseT=setTimeout(function(){tv.className=tv.className.replace(/\s*mouse/,'')},2500)});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
$('tvUA').textContent=navigator.userAgent;
})();
</script>
